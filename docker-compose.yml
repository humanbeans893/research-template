services:
  research-template:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    # No fixed image or container name: Compose derives both from the project
    # directory (or COMPOSE_PROJECT_NAME in .env), so two projects made from
    # this template never overwrite each other's image.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    # The project environment is baked into the image at /opt/venv (Dockerfile).
    # HOME and the caches also stay outside the bind-mounted /workspace, so
    # nothing environment-related is written back to the host.
    environment:
      HOME: /home/app
      DATA_ROOT: /data
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /opt/uv-cache
      XDG_CACHE_HOME: /home/app/.cache
      MPLCONFIGDIR: /home/app/.cache/matplotlib
      # Keep import-time __pycache__ off the bind mount as well.
      PYTHONPYCACHEPREFIX: /home/app/.cache/pycache
    volumes:
      # Tool state under HOME (shell history, downloaded map data, compiled
      # caches) and the uv cache survive container re-creation.
      - home:/home/app
      - uv-cache:/opt/uv-cache
      - .:/workspace
      # Raw data, read-only. HOST_DATA_DIR in .env points at data outside the
      # repository (an external disk, a shared server); the default is data/raw.
      - ${HOST_DATA_DIR:-./data/raw}:/data:ro
      # The same raw data is also visible through `.:/workspace`. Overlay it
      # read-only there too, so it cannot be modified through either path.
      - ${HOST_DATA_DIR:-./data/raw}:/workspace/data/raw:ro
    shm_size: "16g"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # No published ports: start Jupyter on demand, on localhost only (README.md).
    restart: "no"
    tty: true
    stdin_open: true
    command: ["bash"]

volumes:
  home:
  uv-cache:
