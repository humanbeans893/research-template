[project]
name = "research-template"
version = "0.1.0"
description = "Reusable research project template for data analysis, figures, and manuscript drafting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "xarray>=2023.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "numba>=0.58",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
