[project]
name = "research-template"
version = "0.1.0"
description = "Reusable research project template for data analysis, figures, and manuscript drafting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "xarray>=2023.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "numba>=0.58",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Show why tests were skipped, and fail on a mistyped marker or setting.
addopts = "-ra --strict-markers --strict-config"
# Keep the cache off the bind-mounted repository (AGENTS.md, Environment Rules).
cache_dir = "$HOME/.cache/pytest"

[tool.ruff]
target-version = "py311"
# Shared workflow tools are copied verbatim across repositories; ledger output is local.
extend-exclude = [".agent-runs/"]

[tool.ruff.lint.per-file-ignores]
# Entry points put the project root on sys.path before importing config and src.
"experiments/*/run.py" = ["E402"]
"scripts/*.py" = ["E402"]
